<svg viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="وين نتبرع">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F7A47"/>
      <stop offset="100%" stop-color="#0A5230"/>
    </linearGradient>
    <radialGradient id="ping" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6A94A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D6A94A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ground ping under the badge -->
  <ellipse cx="540" cy="182" rx="46" ry="8" fill="url(#ping)"/>

  <!-- icon badge -->
  <g>
    <rect x="460" y="20" width="160" height="160" rx="38" fill="url(#badgeGrad)"/>
    <rect x="460" y="20" width="160" height="160" rx="38" fill="none" stroke="#D6A94A" stroke-width="1.5" opacity="0.35"/>

    <!-- heart-pin mark (bulbous heart tapering to a pin point) -->
    <g transform="translate(484,49) scale(3.6)">
      <path d="M16 29
               C16 29 0 18 0 9.5
               C0 4 4 0 8.5 0
               C12 0 16 4 16 4
               C16 4 20 0 23.5 0
               C28 0 32 4 32 9.5
               C32 18 16 29 16 29
               Z" fill="#FBF7EF"/>
      <!-- small emblem star, echoing the national star -->
      <path d="M16 7.6
               L17.05 10.55
               L20.2 10.6
               L17.65 12.5
               L18.6 15.5
               L16 13.7
               L13.4 15.5
               L14.35 12.5
               L11.8 10.6
               L14.95 10.55
               Z" fill="#C8102E"/>
    </g>
  </g>

  <!-- wordmark, right-to-left -->
  <text x="430" y="95" direction="rtl" text-anchor="end"
        font-family="'Cairo','Tajawal','Noto Kufi Arabic','Segoe UI',sans-serif"
        font-weight="800" font-size="58" fill="#1C2620">وين نتبرع</text>

  <text x="430" y="128" direction="rtl" text-anchor="end"
        font-family="'Cairo','Tajawal','Noto Kufi Arabic','Segoe UI',sans-serif"
        font-weight="500" font-size="20" fill="#5B6A5F">منصة التبرعات والإغاثة الوطنية</text>

  <text x="430" y="155" text-anchor="end"
        font-family="'Helvetica Neue',Arial,sans-serif"
        font-weight="600" font-size="13" letter-spacing="4" fill="#0F7A47">WIN NTBARA3</text>
</svg>
